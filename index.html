<!doctype html><html lang="zh-Hant-HK"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>留一粒米｜種米小遊戲</title><style>body{margin:auto;max-width:42rem;padding:2rem 1rem;font:18px/1.6 system-ui,sans-serif;background:#f7f3e5;color:#233821}main{background:white;border-radius:20px;padding:1.4rem}h1,h2{line-height:1.2}button{font:inherit;background:#295638;color:white;border:0;border-radius:8px;padding:.6rem 1rem;margin:.25rem .4rem .25rem 0;cursor:pointer}button:focus-visible{outline:3px solid #ad5920;outline-offset:3px}small{display:block;margin-top:1rem}svg{width:100%;height:auto;border-radius:12px}progress{width:100%;accent-color:#295638}</style><header><small>香港稻米文化｜課堂原型</small><h1>留一粒米</h1><p>種完一季，你會留低啲咩畀下一位？</p></header><main><svg viewBox="0 0 600 160" aria-hidden="true"><rect width="600" height="160" fill="#d7eacb"/><circle cx="490" cy="45" r="23" fill="#f9d67e"/><path d="M0 100 Q150 42 300 100 Q450 54 600 96 V160 H0Z" fill="#9aaa67"/><path d="M0 130 Q230 92 600 122 V160 H0Z" fill="#826449"/><g id="plants"></g></svg><small id="step"></small><progress id="progress" max="5" aria-label="種植進度"></progress><h2 id="stage" tabindex="-1"></h2><p id="story"></p><div id="actions"></div></main><footer><small>稻田、情節同觀察紀錄均為示意，並非「大地予我」嘅真實田間紀錄。</small></footer><script>
const get=id=>document.getElementById(id);let diary=false;
const scenes=[['落種','你接手咗一小塊田。今季種完，就會交畀下一位種植者。',[['落種',1]]],['照料秧苗','秧苗長出嚟喇。你巡一巡田，繼續照料，等稻穗出現。',[['照料秧苗',2]]],['觀察稻穗','你見到田邊有幾株稻穗嘅穀殼比隔離嗰行深色，原因未明。你會點做？',[['記低觀察',3,true],['唔記，繼續等收割',3,false]]],['收割留種','稻米成熟喇！留起一小包種子，交畀下一位種植者。',[['收割，留種畀下一季',4]]],['交畀下一位','',[['再玩一季',0,false]]]];
function show(i,focus=true){const [title,text,choices]=scenes[i];get('step').textContent=`第 ${i+1}／5 幕`;get('progress').value=i+1;get('stage').textContent=title;get('story').textContent=i!==4?text:diary?'下一位收到種子同日誌：「抽穗後，田邊幾株稻穗嘅穀殼比隔離嗰行深色，原因未明。」佢知道下一季可以留意邊個位置。':'下一位收到同樣多嘅種子，但冇今季嘅日誌。佢可以繼續種，卻唔知道你喺田邊見到咩。';get('actions').replaceChildren();for(const [label,next,record] of choices){const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>{if(record!==undefined)diary=record;show(next)};get('actions').append(b)}get('plants').innerHTML=i>0&&i<4?Array.from({length:10},(_,k)=>{const x=64+k*51,y=135+(k%2)*9,h=i===1?17:37;return `<path d="M${x} ${y} q-4 -${h-6} -13 -${h} M${x} ${y} q5 -${h-4} 15 -${h-2}" fill="none" stroke="${i===1?'#2e6640':'#e3bb54'}" stroke-width="5" stroke-linecap="round"/>`}).join(''):'';if(focus)get('stage').focus()}
show(0,false);
</script></html>
